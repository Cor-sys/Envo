# Single-origin front door for the self-hosted stack.
#   /                -> the React SPA (static files, SPA fallback to index.html)
#   /rest/v1/...     -> PostgREST   (the data API supabase-js talks to)
#   /auth/v1/...     -> GoTrue      (login / sessions / invites)
#   /storage/v1/...  -> storage-api (item photos, SDS PDFs)
#   /functions/v1/.. -> edge-runtime (create-invite, redeem-invite, cache-sds)
#
# Because everything is one origin there is no CORS and the bundle only needs
# to know a single base URL (this host). This replaces Supabase Cloud's API
# gateway with config you can read and own.

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;  # room for SDS PDFs / item photos

    # --- Supabase data API ---
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Accept-Profile $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;
        proxy_set_header Prefer $http_prefer;
    }

    # --- Auth (GoTrue) ---
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
    }

    # --- Storage ---
    location /storage/v1/ {
        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
    }

    # --- Edge Functions ---
    location /functions/v1/ {
        proxy_pass http://functions:9000/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
    }

    # --- The app itself ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # SPA: let React Router handle routes
    }
}
